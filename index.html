<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo App</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="flex">
			<h2>Kanban Board Based Todo App</h2>
			<div class="btn-wrapper flex">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 576 512"
					height="30px"
					width="30px"
					class="theme-toggle icon"
					fill="currentColor"
				>
					<path
						d="M288-32c8 0 15.4 4 19.9 10.6l58.8 87.4 103.4-20.2c7.8-1.5 15.9 .9 21.6 6.6s8.1 13.8 6.6 21.6L478 177.3 565.4 236.1C572 240.5 576 248 576 256s-4 15.4-10.6 19.9L478 334.7 498.2 438c1.5 7.8-.9 15.9-6.6 21.6s-13.8 8.1-21.6 6.6L366.7 446 307.9 533.4C303.4 540 296 544 288 544s-15.4-4-19.9-10.6L209.3 446 105.9 466.2c-7.8 1.5-15.9-.9-21.6-6.6s-8.1-13.8-6.6-21.6L98 334.7 10.6 275.9C4 271.4 0 264 0 256s4-15.4 10.6-19.9L98 177.3 77.8 73.9c-1.5-7.8 .9-15.9 6.6-21.6s13.8-8.1 21.6-6.6l103.3 20.2 58.8-87.4 1.8-2.3C274.4-29 281-32 288-32zm-47.8 138c-5.4 8-15 12-24.5 10.2l-84-16.4 16.4 84c1.8 9.5-2.2 19.1-10.2 24.5L67 256 138 303.8c8 5.4 12 15 10.2 24.5l-16.4 84 84-16.4 3.5-.4c8.3-.4 16.3 3.6 21 10.6l47.8 71 47.8-71 2.2-2.8c5.6-6.1 14-9 22.3-7.3l84 16.4-16.4-84c-1.8-9.5 2.2-19.1 10.2-24.5l71-47.8-71-47.8c-8-5.4-12-15-10.2-24.5l16.4-84-84 16.4c-9.5 1.8-19.1-2.2-24.5-10.2l-47.8-71-47.8 71zM288 376a120 120 0 1 1 0-240 120 120 0 1 1 0 240zm0-192a72 72 0 1 0 0 144 72 72 0 1 0 0-144z"
					/>
				</svg>
				<button class="btn btn-primary add-todo-btn">Add Card</button>
			</div>
		</header>
		<main class="something">
			<section class="todoCol" data-state="todo">
				<div class="title">
					Todo
					<span class="todo-count">0</span>
				</div>
				<div class="card-container todo-container"></div>
			</section>
			<section class="todoCol" data-state="inProgress">
				<div class="title">
					In Progress
					<span class="todo-count">0</span>
				</div>

				<div class="card-container in-progress-container"></div>
			</section>
			<section class="todoCol" data-state="completed">
				<div class="title">
					Completed
					<span class="todo-count">0</span>
				</div>

				<div class="card-container completed-container"></div>
			</section>
		</main>

		<div class="empty-todo hide">
			<img src="assets/empty_todo.svg" alt="emptyState image for todo" class="empty-todo-img" />
			<h2 class="empty-title">Your to-do list is empty</h2>
			<p>Add tasks to keep track of your work.</p>
			<button class="btn btn-primary add-todo-btn">Add Task</button>
		</div>
		<div class="modal hide">
			<div class="modal-body">
				<h3 class="modal-title flex">
					<span class="form-action">Add New Todo</span>
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="icon btn-cancel-todo">
						<path
							d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"
						/>
					</svg>
				</h3>
				<div class="modal-form">
					<div class="input-group flex">
						<label for="todoTitle">Title:</label>
						<input type="text" name="title" id="todoTitle" />
					</div>
					<div class="input-group flex">
						<label for="todoDescription">Description:</label>
						<textarea type="text" name="Description" id="todoDescription" rows="3" cols="40"></textarea>
					</div>

					<div class="input-group flex">
						<label for="todoDueDate">Due Date:</label>
						<input type="date" name="DueDate" id="todoDueDate" />
					</div>
					<div class="input-group flex">
						<label for="todoState">State:</label>
						<select name="State" id="todoState">
							<option value="todo">Todo</option>
							<option value="inProgress">In Progress</option>
							<option value="completed">Completed</option>
						</select>
					</div>
				</div>
				<div class="modal-actions flex">
					<button class="btn btn-secondary btn-cancel-todo" style="background-color: var(--secondary)">
						Cancel
					</button>
					<button class="btn btn-primary btn-submit-todo">Submit</button>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>
