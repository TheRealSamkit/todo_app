<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo App</title>
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
			integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
	</head>
	<body>
		<header class="flex">
			<h2>Kanban Board Based ToDo App</h2>
			<button class="btn add-todo-btn">Add Card</button>
		</header>
		<main>
			<section class="">
				<div class="title">Todo</div>
				<div class="card-container todo-container"></div>
			</section>
			<section class="">
				<div class="title">In Progress</div>

				<div class="card-container in-progress-container"></div>
			</section>
			<section>
				<div class="title">Completed</div>

				<div class="card-container completed-container"></div>
			</section>
		</main>
		<div class="modal hide">
			<div class="modal-body">
				<h3 class="modal-title flex">
					<span class="form-action">Add New Todo</span>
					<svg
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 384 512"
						class="icon btn-cancel-todo"
					>
						<path
							d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"
						/>
					</svg>
				</h3>
				<div class="modal-form">
					<!-- <svg
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 512 512"
						class="icon"
					>
						<path
							d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zm0-384c13.3 0 24 10.7 24 24l0 112c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-112c0-13.3 10.7-24 24-24zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"
						/>
					</svg> -->
					<div class="input-group flex">
						<label for="todoTitle">Title:</label>
						<input type="text" name="title" id="todoTitle" />
					</div>
					<div class="input-group flex">
						<label for="todoDescription">Description:</label>
						<textarea
							type="text"
							name="Description"
							id="todoDescription"
						></textarea>
					</div>

					<div class="input-group flex">
						<label for="todoDueDate">Due Date:</label>
						<input type="date" name="DueDate" id="todoDueDate" />
					</div>
				</div>
				<div class="modal-actions flex">
					<button
						class="btn btn-cancel-todo"
						style="background-color: var(--secondary)"
					>
						Cancel
					</button>
					<button class="btn btn-submit-todo">Submit</button>
				</div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
